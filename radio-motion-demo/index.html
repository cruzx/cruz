<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>有效性审核 Agent</title>
    <style>
      :root {
        --page-bg: #090909;
        --card-bg: #282a2b;
        --card-bg-2: #232526;
        --card-line: rgba(255, 255, 255, 0.08);
        --text: #f7f7f2;
        --muted: #cfcfca;
        --soft: #8f9692;
        --accent: #ff5158;
        --success: #88d39f;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-soft: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--page-bg);
      }

      body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.08), transparent 24%),
          linear-gradient(135deg, #050505, #161717 58%, #050505);
        font-family:
          Inter, "SF Pro Display", "Helvetica Neue", Arial, "PingFang SC",
          "Microsoft YaHei", sans-serif;
        color: var(--text);
      }

      .demo-shell {
        width: 100%;
        max-width: 1180px;
        min-height: 470px;
        padding: 34px;
        display: grid;
        place-items: center;
      }

      .agent-module {
        width: 100%;
        max-width: 1120px;
        min-width: 0;
        position: relative;
      }

      .agent-card {
        width: 100%;
        max-width: 100%;
        min-height: 152px;
        border: 1px solid var(--card-line);
        border-radius: 18px;
        position: relative;
        overflow: hidden;
        color: inherit;
        background:
          radial-gradient(circle at 22% 0%, rgba(255, 255, 255, 0.12), transparent 31%),
          radial-gradient(circle at 86% 100%, rgba(255, 255, 255, 0.06), transparent 30%),
          linear-gradient(135deg, var(--card-bg), var(--card-bg-2));
        box-shadow:
          0 24px 70px rgba(0, 0, 0, 0.46),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        cursor: pointer;
        text-align: left;
        transition:
          min-height 620ms var(--ease-out),
          border-radius 620ms var(--ease-out),
          border-color 220ms ease,
          box-shadow 620ms var(--ease-out),
        transform 360ms var(--ease-soft);
      }

      .agent-card:hover {
        border-color: rgba(255, 255, 255, 0.16);
        transform: translateY(-2px);
      }

      .agent-card:focus-visible {
        outline: 3px solid rgba(255, 81, 88, 0.48);
        outline-offset: 5px;
      }

      .agent-module.is-open .agent-card {
        min-height: 336px;
        border-radius: 22px;
        box-shadow:
          0 32px 90px rgba(0, 0, 0, 0.52),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .card-head {
        min-height: 152px;
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr) 52px;
        gap: 28px;
        align-items: center;
        padding: 34px 42px 34px 34px;
      }

      .agent-title {
        margin: 0;
        font-size: clamp(26px, 3vw, 36px);
        line-height: 1.08;
        font-weight: 800;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .agent-desc {
        margin: 0;
        min-width: 0;
        max-width: 750px;
        color: var(--muted);
        font-size: clamp(18px, 2.25vw, 30px);
        line-height: 1.45;
        font-weight: 760;
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      .corner-arrow {
        width: 46px;
        height: 46px;
        justify-self: end;
        align-self: end;
        position: relative;
        color: var(--accent);
        transform: translate(8px, 16px) rotate(38deg);
        transition:
          transform 520ms var(--ease-soft),
          color 220ms ease;
      }

      .corner-arrow::before {
        content: "";
        position: absolute;
        left: 3px;
        top: 20px;
        width: 40px;
        height: 8px;
        border-radius: 999px;
        background: currentColor;
      }

      .corner-arrow::after {
        content: "";
        position: absolute;
        right: 0;
        top: 9px;
        width: 25px;
        height: 25px;
        border-top: 8px solid currentColor;
        border-right: 8px solid currentColor;
        transform: rotate(45deg);
      }

      .agent-card:hover .corner-arrow {
        color: #ff6b70;
        transform: translate(4px, 12px) rotate(38deg) scale(1.08);
      }

      .agent-module.is-open .corner-arrow {
        transform: translate(2px, 6px) rotate(-142deg) scale(0.92);
      }

      .audit-panel {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 22px;
        padding: 0 34px 34px;
        opacity: 0;
        max-height: 0;
        transform: translateY(-10px);
        transition:
          opacity 420ms ease,
          max-height 620ms var(--ease-out),
          transform 620ms var(--ease-out);
        pointer-events: none;
      }

      .agent-module.is-open .audit-panel {
        opacity: 1;
        max-height: 180px;
        transform: translateY(0);
        pointer-events: auto;
      }

      .audit-list,
      .audit-result {
        min-width: 0;
        min-height: 132px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        background: rgba(8, 9, 9, 0.28);
      }

      .audit-list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 14px;
      }

      .audit-item {
        min-width: 0;
        padding: 13px 12px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.05);
      }

      .audit-item strong {
        display: block;
        margin-bottom: 7px;
        font-size: 15px;
        line-height: 1.2;
      }

      .audit-item span {
        display: block;
        color: var(--soft);
        font-size: 13px;
        line-height: 1.4;
      }

      .audit-result {
        padding: 18px;
        display: grid;
        align-content: center;
        gap: 12px;
      }

      .score-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
      }

      .score-label {
        color: var(--soft);
        font-size: 14px;
      }

      .score {
        color: var(--success);
        font-size: 36px;
        line-height: 1;
        font-weight: 800;
      }

      .progress {
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }

      .progress span {
        display: block;
        width: 94%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #77c7ff, var(--success));
      }

      .status {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--muted);
        font-size: 14px;
        overflow-wrap: anywhere;
      }

      .status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--success);
        box-shadow: 0 0 0 5px rgba(136, 211, 159, 0.1);
      }

      @media (max-width: 820px) {
        body {
          overflow: auto;
          overflow-x: hidden;
        }

        .demo-shell {
          min-height: 100vh;
          max-width: none;
          padding: 18px;
        }

        .card-head {
          min-height: 248px;
          display: block;
          padding: 28px 24px 30px;
        }

        .agent-title {
          white-space: normal;
        }

        .agent-desc {
          margin-top: 18px;
          font-size: 20px;
          line-height: 1.5;
        }

        .corner-arrow {
          display: block;
          margin: 18px 0 0 auto;
          transform: translate(2px, 8px) rotate(38deg) scale(0.86);
        }

        .audit-panel {
          grid-template-columns: 1fr;
          padding: 0 18px 18px;
        }

        .agent-module.is-open .audit-panel {
          max-height: 620px;
        }

        .audit-list {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="demo-shell" aria-label="有效性审核 Agent 演示">
      <section class="agent-module" id="agentModule">
        <article
          class="agent-card"
          id="agentCard"
          role="button"
          tabindex="0"
          aria-expanded="false"
          aria-controls="auditPanel"
        >
          <div class="card-head">
            <h1 class="agent-title">有效性审核Agent</h1>
            <p class="agent-desc">
              进行全流程有效性审核，过滤无效、虚假、片面信息，校验内容准确性与关联性，确保归档资料、可视化页面的真实性、标准化和可用性，为后续分析决策提供可靠的数据支撑，避免无效信息干扰判断。
            </p>
            <span class="corner-arrow" aria-hidden="true"></span>
          </div>

          <div class="audit-panel" id="auditPanel">
            <div class="audit-list" aria-label="审核维度">
              <div class="audit-item">
                <strong>真实性</strong>
                <span>识别虚假、重复、来源异常的信息。</span>
              </div>
              <div class="audit-item">
                <strong>准确性</strong>
                <span>校验字段、口径、时间与事实一致性。</span>
              </div>
              <div class="audit-item">
                <strong>可用性</strong>
                <span>输出标准化结论，保留可追溯依据。</span>
              </div>
            </div>

            <div class="audit-result" aria-label="审核结果">
              <div class="score-row">
                <span class="score-label">当前资料可信度</span>
                <span class="score">94%</span>
              </div>
              <div class="progress" aria-hidden="true">
                <span></span>
              </div>
              <div class="status">已完成 12 项校验，发现 2 条需复核信息</div>
            </div>
          </div>
        </article>
      </section>
    </main>

    <script>
      const agentModule = document.querySelector("#agentModule");
      const agentCard = document.querySelector("#agentCard");
      const params = new URLSearchParams(window.location.search);

      if (params.get("state") === "open") {
        agentModule.classList.add("is-open");
        agentCard.setAttribute("aria-expanded", "true");
      }

      agentCard.addEventListener("click", () => {
        toggleAgent();
      });

      agentCard.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggleAgent();
        }
      });

      function toggleAgent() {
        const isOpen = agentModule.classList.toggle("is-open");
        agentCard.setAttribute("aria-expanded", String(isOpen));
      }
    </script>
  </body>
</html>
